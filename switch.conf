# switch.conf - example config: "key value" per line, '#' starts a comment
mac_age 30
mac_max 1024
mac_per_port 16
queue_size 256
rate_limit 1000
port_wait 5
wrr 5 3 1

# vlan <port> <vlan>   (ports are numbered from 1, default vlan is 1)
vlan 1 10
vlan 2 10
vlan 3 20

# trunk <port>   (0 means no trunk port)
trunk 4
